name: Validate knowledge
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/knowledge.py validate
      - run: python scripts/knowledge.py check-export
      - run: python -m unittest discover -s tests
      - run: python scripts/knowledge.py build
      - run: python scripts/knowledge.py search evaluation
